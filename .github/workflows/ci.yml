name: FlowForge CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux-sanitizers:
    name: Linux ASan and UBSan
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ cmake ninja-build

      - name: Configure sanitizer build
        run: cmake --preset asan

      - name: Build FlowForge
        run: cmake --build --preset asan --parallel 2

      - name: Run sanitizer tests
        run: ctest --preset asan
