name: FlowForge CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux-sanitizers:
    name: Linux ASan and UBSan
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ cmake ninja-build

      - name: Configure sanitizer build
        run: |
          cmake -S . -B build-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=g++ \
            "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer -g" \
            "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined" \
            -DFLOWFORGE_BUILD_TESTS=ON \
            -DFLOWFORGE_BUILD_BENCHMARKS=OFF \
            -DFLOWFORGE_BUILD_EXAMPLES=OFF \
            -DFLOWFORGE_BUILD_CLI=OFF

      - name: Build FlowForge
        run: cmake --build build-ci --parallel 2

      - name: Run sanitizer tests
        run: ctest --test-dir build-ci --output-on-failure
        env:
          ASAN_OPTIONS: detect_leaks=1
